name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['README.md']
  pull_request:
    paths-ignore: ['README.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  tooling:
    name: Tooling and whitespace
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Test release validation
        run: make python-tests
      - name: Check whitespace
        run: git diff-tree --check HEAD

  paclet:
    name: Check, test and build (Wolfram 15.0)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: wolframresearch/wolframengine:15.0
      options: --user root
    env:
      WOLFRAMSCRIPT_ENTITLEMENTID: ${{ secrets.WOLFRAMSCRIPT_ENTITLEMENTID }}
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git curl make python3 openssl ca-certificates
          git config --system --add safe.directory "$GITHUB_WORKSPACE"
      - name: Verify bounded-download backend
        run: |
          python3 - <<'PY'
          import re
          import subprocess
          result = subprocess.run(["curl", "--disable", "--version"],
                                  check=True, capture_output=True, text=True, timeout=5)
          print(result.stdout, end="")
          version = re.match(r"curl (\d+)\.(\d+)\.(\d+)", result.stdout)
          if version is None or tuple(map(int, version.groups())) < (8, 4, 0):
              raise SystemExit("Download checks require curl 8.4 or newer.")
          PY
      - uses: actions/checkout@v7
      - uses: ./.github/actions/wolfram-license
      - uses: actions/setup-python@v7
        id: h5ad-python
        with:
          python-version: '3.13'
      # The host tool-cache pip launcher has a host-only shebang in containers.
      # Cache its downloads directly and invoke pip through the selected Python.
      - name: Cache optional Python dependencies
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/biodatalink-pip-cache
          key: ${{ runner.os }}-${{ runner.arch }}-h5ad-python313-${{ hashFiles('BioDataLink/Assets/Python/requirements-h5ad.txt', 'BioDataLink/Tests/Python/requirements.txt') }}
      - name: Configure the explicit H5AD test backend
        env:
          H5AD_PYTHON: ${{ steps.h5ad-python.outputs.python-path }}
        run: |
          "$H5AD_PYTHON" -m pip install --cache-dir "$RUNNER_TEMP/biodatalink-pip-cache" \
            -r BioDataLink/Tests/Python/requirements.txt
          echo "BIODATALINK_PYTHON=$H5AD_PYTHON" >> "$GITHUB_ENV"
      - name: Acquire documentation tooling
        run: make bootstrap
      - name: Check metadata, code and documentation sources
        run: make check
      - name: Run offline tests
        run: make test
      - name: Verify bounded HTTPS downloads with a temporary loopback CA
        run: make download-tests
      - name: Verify H5AD against independent AnnData fixtures
        run: make h5ad-tests
      - name: Verify tutorial initialization and cached builds
        run: make documentation-tests
      - name: Build and verify archive without cloud writes
        run: make check-publish
      - name: Upload verified paclet
        uses: actions/upload-artifact@v7
        with:
          name: paclet
          path: BioDataLink/build/*.paclet
          if-no-files-found: error
          retention-days: 30
