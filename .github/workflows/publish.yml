name: Publish

# Called after the verified GitHub release; manual dispatch can retry publication.
on:
  workflow_call:
    inputs:
      tag:
        description: Existing released version tag (vMAJOR.MINOR.PATCH)
        required: true
        type: string
      confirm:
        description: Authorize publication after the release and CI gates
        required: true
        type: boolean
    secrets:
      WOLFRAMSCRIPT_ENTITLEMENTID:
        required: true
      WOLFRAM_CLOUD_USER:
        required: true
      WOLFRAM_CLOUD_PASSWORD:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Existing released version tag (vMAJOR.MINOR.PATCH)
        required: true
        type: string
      confirm:
        description: Publish this release to the configured Wolfram Cloud account
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: publish-biodatalink
  cancel-in-progress: false

jobs:
  publish:
    if: inputs.confirm
    name: Publish released paclet and documentation
    environment: wolfram-cloud
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: wolframresearch/wolframengine:15.0
      options: --user root
    env:
      WOLFRAMSCRIPT_ENTITLEMENTID: ${{ secrets.WOLFRAMSCRIPT_ENTITLEMENTID }}
      WOLFRAM_CLOUD_USER: ${{ secrets.WOLFRAM_CLOUD_USER }}
      WOLFRAM_CLOUD_PASSWORD: ${{ secrets.WOLFRAM_CLOUD_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
      QT_QPA_PLATFORM: offscreen
    defaults:
      run:
        shell: bash
    steps:
      - name: Install tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git curl gh make python3
          git config --system --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - name: Verify released tag and exact main CI commit
        run: |
          python3 scripts/validate_release.py "$TAG" --require-ci
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
      - name: Check publication credentials are configured
        run: |
          test -n "$WOLFRAM_CLOUD_USER" || { echo 'Missing WOLFRAM_CLOUD_USER' >&2; exit 1; }
          test -n "$WOLFRAM_CLOUD_PASSWORD" || { echo 'Missing WOLFRAM_CLOUD_PASSWORD' >&2; exit 1; }
      - uses: ./.github/actions/wolfram-license
      - name: Acquire documentation tooling
        run: make bootstrap
      - name: Recheck source and tests
        run: make check test python-tests
      - name: Publish
        run: make publish
      - name: Retain the publication URLs and version
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: publication
          path: BioDataLink/build/publication.json
          if-no-files-found: ignore
          retention-days: 30
