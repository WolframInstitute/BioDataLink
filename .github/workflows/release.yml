name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release the verified CI artifact
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - name: Verify version and exact main CI commit
        id: verified
        run: |
          ci_run_id=$(python3 scripts/validate_release.py "$TAG" --require-ci)
          echo "run-id=$ci_run_id" >> "$GITHUB_OUTPUT"
      - name: Download verified artifact
        uses: actions/download-artifact@v8
        with:
          name: paclet
          path: dist
          run-id: ${{ steps.verified.outputs.run-id }}
          github-token: ${{ github.token }}
      - name: Create release
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to replace published assets.' >&2
            exit 1
          fi
          gh release create "$TAG" dist/*.paclet --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" --generate-notes --verify-tag
