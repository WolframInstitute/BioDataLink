name: Verify Wolfram Engine license
description: >-
  Fails fast with an actionable message when the WOLFRAMSCRIPT_ENTITLEMENTID secret is
  missing, configures direct child kernels, and checks both parent and child licensing.

runs:
  using: composite
  steps:
    - name: Configure and verify parent and child kernel licenses
      shell: bash
      run: |
        if [ -z "${WOLFRAMSCRIPT_ENTITLEMENTID:-}" ]; then
          echo "::error title=Missing Wolfram license::WOLFRAMSCRIPT_ENTITLEMENTID is not set. Add an on-demand license entitlement ID as a repository secret (and as a Dependabot secret, so Dependabot pull requests can run CI); see CONTRIBUTING.md, \"Continuous integration\"."
          exit 1
        fi
        # Direct WolframKernel children do not use WOLFRAMSCRIPT_ENTITLEMENTID.
        # Official configuration: https://github.com/WolframResearch/WolframWebEngineForPython#using-docker
        export WOLFRAMINIT="-pwfile !cloudlm.wolfram.com -entitlement $WOLFRAMSCRIPT_ENTITLEMENTID"
        printf 'WOLFRAMINIT=%s\n' "$WOLFRAMINIT" >> "$GITHUB_ENV"
        wolframscript -code '
          Print["Wolfram Engine ", $Version, " | license type: ", $LicenseType];
          kernel = SelectFirst[
            FileNameJoin[Prepend[#, $InstallationDirectory]] & /@
              {{"MacOS", "WolframKernel"}, {"Executables", "WolframKernel"}, {"Executables", "WolframKernel.exe"}},
            FileExistsQ, None];
          If[kernel === None, Print["Direct kernel executable not found."]; Exit[1]];
          process = None;
          probe = Quiet[Check[WithCleanup[
            process = StartProcess[{kernel, "-noprompt", "-run", "Print[\"BIODATALINK-CHILD-READY\"]; Exit[0]"}],
            TimeConstrained[
              While[ProcessStatus[process] === "Running", Pause[0.1]];
              ProcessInformation[process, "ExitCode"] === 0 &&
                StringContainsQ[ReadString[process], "BIODATALINK-CHILD-READY"],
              60, False],
            If[Head[process] === ProcessObject && ProcessStatus[process] === "Running", KillProcess[process]]
          ], False]];
          If[!TrueQ[probe],
            Print["Direct child kernel licensing failed. The entitlement must allow the parent and a fresh child kernel concurrently."];
            Exit[1]];
          Print["Direct child kernel licensing verified."]'
